<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Soft Ground Shadow -->
    <radialGradient id="groundShadow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A2B48" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#1A2B48" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#1A2B48" stop-opacity="0" />
    </radialGradient>

    <!-- Box Gradients -->
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE0B2" />
      <stop offset="100%" stop-color="#FFBC7D" />
    </linearGradient>
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E56" />
      <stop offset="100%" stop-color="#D9772B" />
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9772B" />
      <stop offset="100%" stop-color="#B55915" />
    </linearGradient>

    <!-- Brand Orange Tape -->
    <linearGradient id="brandOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A" />
      <stop offset="100%" stop-color="#E04F00" />
    </linearGradient>

    <!-- Magnifying Glass Gradients -->
    <linearGradient id="navyRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C4268" />
      <stop offset="100%" stop-color="#121E33" />
    </linearGradient>
    <linearGradient id="glassLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FA" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#80DEEA" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#26C6DA" stop-opacity="0.75" />
    </linearGradient>
    
    <!-- Drop Shadow for Magnifier -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="5" stdDeviation="4" flood-color="#0F1A2C" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Floating Shadow -->
  <ellipse cx="56" cy="102" rx="38" ry="10" fill="url(#groundShadow1)" />

  <!-- 3D Isometric Parcel Box -->
  <g transform="translate(-4, -2)">
    <!-- Top Face -->
    <path d="M56 22 L94 40 L56 58 L18 40 Z" fill="url(#boxTop)" />
    <!-- Left Face -->
    <path d="M18 40 L56 58 L56 96 L18 78 Z" fill="url(#boxLeft)" />
    <!-- Right Face -->
    <path d="M56 58 L94 40 L94 78 L56 96 Z" fill="url(#boxRight)" />

    <!-- Orange Packing Tape Across Top & Sides -->
    <path d="M35 30 L73 48 L79 45 L41 27 Z" fill="url(#brandOrange)" />
    <path d="M35 48 L41 51 L41 66 L35 63 Z" fill="url(#brandOrange)" />
    <path d="M73 48 L79 45 L79 60 L73 63 Z" fill="#C84300" />

    <!-- Shipping Label / Barcode on Left Face -->
    <polygon points="26,56 44,64 44,76 26,68" fill="#FFF8F0" opacity="0.9" />
    <line x1="29" y1="61" x2="39" y2="65.5" stroke="#1A2B48" stroke-width="2" stroke-linecap="round" />
    <line x1="29" y1="65" x2="35" y2="67.8" stroke="#FF6B00" stroke-width="2" stroke-linecap="round" />

    <!-- Specular Edge Highlights -->
    <path d="M18 40 L56 58 L94 40" fill="none" stroke="#FFF3E0" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <line x1="56" y1="58" x2="56" y2="96" stroke="#FFE0B2" stroke-width="1.2" opacity="0.4" />
  </g>

  <!-- 3D Magnifying Glass (Overlay) -->
  <g filter="url(#dropShadow)">
    <!-- Handle Connector -->
    <rect x="82" y="75" width="8" height="10" rx="2" transform="rotate(-45 86 80)" fill="#B0BEC5" />
    <!-- Orange 3D Handle -->
    <rect x="85" y="77" width="12" height="26" rx="6" transform="rotate(-45 91 90)" fill="url(#brandOrange)" />
    <!-- Handle Highlight -->
    <line x1="86" y1="82" x2="96" y2="92" stroke="#FFAB73" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

    <!-- Outer Navy Rim -->
    <circle cx="70" cy="64" r="22" fill="url(#navyRim)" />
    <!-- Inner Bevel -->
    <circle cx="70" cy="64" r="17.5" fill="#101B2E" />
    <!-- Translucent Cyan Lens -->
    <circle cx="70" cy="64" r="16" fill="url(#glassLens)" />

    <!-- Glossy Reflection on Lens -->
    <path d="M59 56 A 13 13 0 0 1 78 53 A 14 12 0 0 0 61 64 Z" fill="#FFFFFF" opacity="0.65" />
    <circle cx="77" cy="71" r="2.5" fill="#FFFFFF" opacity="0.4" />
  </g>
</svg>