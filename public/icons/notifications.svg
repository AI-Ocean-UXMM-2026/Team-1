<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Ground Shadow -->
    <radialGradient id="groundShadow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A2B48" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#1A2B48" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#1A2B48" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Bell Body Gradient -->
    <linearGradient id="bellBody" x1="20%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="45%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#D9480F" />
    </linearGradient>

    <!-- Bell Rim Highlight -->
    <linearGradient id="bellRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="50%" stop-color="#FF922B" />
      <stop offset="100%" stop-color="#C93B00" />
    </linearGradient>

    <!-- Clapper / Dark Navy Accent -->
    <linearGradient id="navyClapper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334E7B" />
      <stop offset="100%" stop-color="#16243B" />
    </linearGradient>
  </defs>

  <!-- Soft Shadow -->
  <ellipse cx="60" cy="103" rx="34" ry="8" fill="url(#groundShadow3)" />

  <!-- Sound/Ring Waves (Left & Right) -->
  <path d="M22 46 A 22 22 0 0 0 18 66" stroke="#FF8A00" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.65" />
  <path d="M14 40 A 30 30 0 0 0 9 68" stroke="#FFC078" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.45" />
  <path d="M98 46 A 22 22 0 0 1 102 66" stroke="#FF8A00" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.65" />
  <path d="M106 40 A 30 30 0 0 1 111 68" stroke="#FFC078" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.45" />

  <!-- Straight Upright Bell Group -->
  <g>
    <!-- Top Ring / Handle -->
    <circle cx="60" cy="22" r="7" fill="url(#navyClapper)" />
    <circle cx="60" cy="22" r="3" fill="#FFFFFF" />

    <!-- Bell Clapper (Bottom Sphere) -->
    <circle cx="60" cy="88" r="10" fill="url(#navyClapper)" />
    <circle cx="57" cy="86" r="3" fill="#5C7CFA" opacity="0.4" />

    <!-- Main Bell Dome -->
    <path d="M60 26 C41 26 32 39 32 58 C32 69 25 75 23 78 H97 C95 75 88 69 88 58 C88 39 79 26 60 26 Z" fill="url(#bellBody)" />

    <!-- 3D Glossy Specular Highlight on Left Side of Dome -->
    <path d="M52 31 C42 34 38 44 38 57 C38 64 35 69 33 72 H41 C42 68 44 63 44 56 C44 44 47 36 55 32 Z" fill="#FFF3BF" opacity="0.65" />

    <!-- Bottom Cylindrical Lip / Rim -->
    <rect x="21" y="74" width="78" height="10" rx="5" fill="url(#bellRim)" />
    <!-- Rim Top Highlight -->
    <line x1="26" y1="76" x2="75" y2="76" stroke="#FFF9DB" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Decorative Sparkles -->
  <path d="M96 22 L97.5 25.5 L101 27 L97.5 28.5 L96 32 L94.5 28.5 L91 27 L94.5 25.5 Z" fill="#FFB800" />
</svg>