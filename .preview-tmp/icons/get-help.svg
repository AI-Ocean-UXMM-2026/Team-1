<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Soft Ground Shadow -->
    <radialGradient id="groundShadow4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A2B48" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#1A2B48" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#1A2B48" stop-opacity="0" />
    </radialGradient>

    <!-- Back Bubble (Deep Navy) -->
    <linearGradient id="navyBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B5988" />
      <stop offset="100%" stop-color="#182842" />
    </linearGradient>

    <!-- Front Bubble (Brand Orange) -->
    <linearGradient id="orangeBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9233" />
      <stop offset="55%" stop-color="#FF6200" />
      <stop offset="100%" stop-color="#D14700" />
    </linearGradient>

    <!-- Cream/White 3D Question Mark -->
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFE8CC" />
    </linearGradient>

    <!-- Floating Shadow Between Bubbles -->
    <filter id="bubbleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-3" dy="5" stdDeviation="4" flood-color="#0D1726" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="60" cy="103" rx="38" ry="8" fill="url(#groundShadow4)" />

  <!-- Back Chat Bubble (Navy Support Dots) -->
  <g transform="translate(8, 16)">
    <path d="M26 10 H62 C74 10 84 19 84 31 V45 C84 57 74 66 62 66 H34 L18 76 L21 62 C13 58 8 50 8 41 V31 C8 19 16 10 26 10 Z" fill="url(#navyBubble)" />
    <!-- Subtle Top Highlight -->
    <path d="M26 12 H62 C71 12 79 18 81 26 C78 19 71 15 62 15 H26 C17 15 11 20 10 28 C10 19 17 12 26 12 Z" fill="#6384B8" opacity="0.45" />
    <!-- Chat Dots Visible on Left -->
    <circle cx="25" cy="38" r="4" fill="#8DA9D4" />
    <circle cx="38" cy="38" r="4" fill="#8DA9D4" opacity="0.7" />
  </g>

  <!-- Front Chat Bubble (Vibrant Orange with Question Mark) -->
  <g filter="url(#bubbleShadow)">
    <path d="M52 32 H86 C98 32 108 42 108 54 V66 C108 78 98 88 86 88 H82 L90 99 L71 88 H52 C40 88 30 78 30 66 V54 C30 42 40 32 52 32 Z" fill="url(#orangeBubble)" />
    
    <!-- Glossy 3D Rim Highlight -->
    <path d="M52 35 H86 C95 35 103 41 105 50 C102 43 95 38 86 38 H52 C42 38 35 44 33 52 C33 42 41 35 52 35 Z" fill="#FFC085" opacity="0.65" />

    <!-- 3D Question Mark Inside Front Bubble -->
    <g transform="translate(1, 1)">
      <!-- Question Mark Curve -->
      <path d="M61 51 C61 46.5 64.5 44 69 44 C73.5 44 77 46.8 77 51 C77 54.5 74.5 56.5 71.5 58.2 C69.2 59.5 68.5 61 68.5 63.5" stroke="url(#creamGrad)" stroke-width="6.5" stroke-linecap="round" fill="none" />
      <!-- Question Mark Dot -->
      <circle cx="68.5" cy="73.5" r="3.8" fill="url(#creamGrad)" />
    </g>
  </g>

  <!-- Friendly Sparkle Accent -->
  <circle cx="102" cy="24" r="3" fill="#FFB800" />
  <circle cx="20" cy="82" r="2.5" fill="#FF8533" opacity="0.8" />
</svg>