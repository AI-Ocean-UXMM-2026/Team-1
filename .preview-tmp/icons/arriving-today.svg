<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Soft Ground Shadow -->
    <radialGradient id="groundShadow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A2B48" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#1A2B48" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#1A2B48" stop-opacity="0" />
    </radialGradient>

    <!-- Cargo Box Orange Gradients -->
    <linearGradient id="cargoBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8533" />
      <stop offset="60%" stop-color="#FF6200" />
      <stop offset="100%" stop-color="#D94E00" />
    </linearGradient>
    <linearGradient id="cargoRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFAD75" />
      <stop offset="100%" stop-color="#FF7A1A" />
    </linearGradient>

    <!-- Cabin White/Silver Gradients -->
    <linearGradient id="cabinBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#EDF2F7" />
      <stop offset="100%" stop-color="#CBD5E0" />
    </linearGradient>

    <!-- Windshield Navy/Cyan -->
    <linearGradient id="windshield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D4A77" />
      <stop offset="100%" stop-color="#16253D" />
    </linearGradient>

    <!-- Wheel Gradient -->
    <linearGradient id="tireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="100%" stop-color="#111722" />
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="62" cy="99" rx="44" ry="9" fill="url(#groundShadow2)" />

  <!-- Speed Motion Lines (Left) -->
  <rect x="6" y="52" width="14" height="4" rx="2" fill="#FF8533" opacity="0.8" />
  <rect x="2" y="62" width="18" height="4" rx="2" fill="#FFB380" opacity="0.6" />
  <rect x="9" y="72" width="10" height="4" rx="2" fill="#FF6200" opacity="0.5" />

  <!-- Main Truck Group -->
  <g transform="translate(4, 2)">
    <!-- Rear Cargo Box (Brand Orange) -->
    <rect x="20" y="34" width="52" height="48" rx="8" fill="url(#cargoBody)" />
    <!-- Cargo Top Highlight -->
    <path d="M28 34 H64 A8 8 0 0 1 72 42 V44 H20 V42 A8 8 0 0 1 28 34 Z" fill="url(#cargoRoof)" />
    
    <!-- Fast Delivery Lightning / Arrow Stripe on Cargo -->
    <path d="M32 58 H54 L49 52 M54 58 L49 64" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9" />

    <!-- Front Cabin -->
    <path d="M68 46 H86 C92 46 97 50 99 56 L104 68 C105 71 105 74 105 77 V78 C105 80 103 82 101 82 H68 V46 Z" fill="url(#cabinBody)" />

    <!-- Windshield -->
    <path d="M73 51 H86 C89 51 92 53 94 57 L97 65 H73 V51 Z" fill="url(#windshield)" />
    <!-- Windshield Glare -->
    <polygon points="76,51 82,51 77,65 73,65" fill="#63B3ED" opacity="0.35" />

    <!-- Dark Navy Chassis Bumper -->
    <rect x="18" y="78" width="89" height="7" rx="3.5" fill="#1A2B48" />

    <!-- Glowing Headlight -->
    <rect x="100" y="70" width="6" height="6" rx="3" fill="#FFD43B" />
    <circle cx="103" cy="73" r="5" fill="#FFD43B" opacity="0.35" />

    <!-- Rear Wheel -->
    <g transform="translate(38, 84)">
      <circle cx="0" cy="0" r="12" fill="url(#tireGrad)" />
      <circle cx="0" cy="0" r="6" fill="#E2E8F0" />
      <circle cx="0" cy="0" r="3" fill="#FF6200" />
    </g>

    <!-- Front Wheel -->
    <g transform="translate(86, 84)">
      <circle cx="0" cy="0" r="12" fill="url(#tireGrad)" />
      <circle cx="0" cy="0" r="6" fill="#E2E8F0" />
      <circle cx="0" cy="0" r="3" fill="#FF6200" />
    </g>
  </g>
</svg>